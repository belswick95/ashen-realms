<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashen Realms</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#151b16;color:#e9ddbd;font:14px Georgia,serif}canvas{display:block}aside{position:absolute;top:12px;left:12px;background:#1c241de8;border:2px solid #92794d;padding:14px;min-width:220px}h1{margin:0;color:#e4c57f}#side{position:absolute;top:12px;right:12px;background:#1c241de8;border:2px solid #92794d;padding:12px;width:200px}#inventory{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}.slot{height:37px;border:1px solid #665b41;background:#2e3429;display:grid;place-items:center;font:11px Arial}#log{position:absolute;bottom:12px;left:12px;background:#151a16e8;border:2px solid #92794d;padding:12px;width:min(500px,calc(100vw - 24px));height:100px;overflow:auto;font:13px Arial}button{background:#715a30;color:white;border:1px solid #bca16a;padding:7px;cursor:pointer;margin-top:9px}@media(max-width:600px){aside{padding:8px;min-width:155px}#side{width:145px;top:auto;bottom:120px}}</style></head><body><aside><h1>Ashen Realms</h1><small>Pre-alpha • The Heartlands</small><div id="stats"></div><button id="reset">Reset character</button><p style="font:11px Arial">Click to move / gather<br>Drag to rotate • Scroll to zoom</p></aside><div id="side"><b>Inventory</b><div id="inventory"></div></div><div id="log"></div><script type="module" src="/game.js"></script></body></html>
