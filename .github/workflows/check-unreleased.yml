name: Check unreleased Eldervale
on:
  push:
    branches: [work/character-overhaul-unreleased, release/eldervale-production-integration-20261102]
  pull_request:
    branches: [feature/materials-character-animation, main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:auth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldervale-offline-qa
          path: test-results/
          if-no-files-found: ignore
