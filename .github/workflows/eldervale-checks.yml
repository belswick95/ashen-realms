name: Eldervale quality checks
on:
  pull_request:
  push:
    branches:
      - feature/login-soundtrack-overhaul
      - release/eldervale-production-integration-20261102
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
